# Ensemble description: cl3_48_64_b6p1_m0p2450
#
# Nf=3 stout-clover, 48^3 x 64, beta = 6.1, m = -0.2450 (ensemble K of the
# H-dibaryon paper). The gauge configurations are NOT on NERSC HPSS under
# clover-iso: the directories cl3_48_64_b6p1_m0p2450{,_a,_b} hold only 2012
# analysis output and sparse propagators (their location is being asked
# around, 2026-10-19). The dataset exists so the ensemble's physics and
# downstream observables are registered; it has no configuration records
# until the files are found.
# Action numbers as for the other beta = 6.1 ensembles (from the 24^3 x 48
# restart input).

[ensemble]
name = "cl3_48_64_b6p1_m0p2450"
display_name = "cl3 48^3x64 beta=6.1 m=-0.2450"
collaboration = "NPLQCD"
generated_by = "W. Detmold (NERSC user wdetmold)"
code = "Chroma hmc (3.40.0 era)"
storage = "nersc_hpss"
description = """\
Nf=3 (SU(3)-flavor-symmetric, m_l = m_s) stout-smeared clover Wilson fermion \
ensemble on a 48^3 x 64 lattice with the tree-level Luscher-Weisz gauge action \
at beta = 6.1 and bare quark mass -0.2450, the largest volume at the \
SU(3)-symmetric point used in NPLQCD's light nuclei and hypernuclei studies. \
Generated by NPLQCD (W. Detmold) with Chroma HMC. The gauge configurations \
are not archived on NERSC HPSS (only derived data is); this record registers \
the ensemble and its observables. Part of the NPLQCD clover-iso ensemble set."""

[lqcd]
nflavors = 3
flavor_structure = "3 degenerate (m_u = m_d = m_s)"
beta = 6.1
Nx = 48
Ny = 48
Nz = 48
Nt = 64
volume = [48, 48, 48, 64]
status = "gauge configurations not archived on NERSC HPSS (2026-10-19); derived data only"

[lqcd.action]
gauge = "LW_TREE"
gauge_u0 = 0.832605301399891
fermion = "clover"
fermion_state = "STOUT_FERM_STATE"
csw = 1.24930970916466
anisotropic = false
fermion_bc = "1 1 1 -1"

[lqcd.mass]
light = -0.2450
strange = -0.2450

[lqcd.smearing]
type = "stout"
rho = 0.125
n_smear = 1

[lqcd.hmc]
tau0 = 1.414
integrator = "LCM_STS_MIN_NORM_2"
save_interval = 10

[streams.main]
dir = "cl3_48_64_b6p1_m0p2450"
note = "No cfgs directory on HPSS; the directory holds analysis output only."
[streams.a]
dir = "cl3_48_64_b6p1_m0p2450_a"
note = "No cfgs directory on HPSS; sparse propagators and contraction databases only."
[streams.b]
dir = "cl3_48_64_b6p1_m0p2450_b"
note = "No cfgs directory on HPSS; sparse propagators and 2012 analysis output only."

[[files]]
pattern = '^cfgs/.+_cfg_(?P<trajectory>\d+)\.lime$'
kind = "gauge_config"
format = "application/x-lime"
description = "Gauge configuration in SciDAC/ILDG LIME format."

# ---------------------------------------------------------------------------
# Downstream observables (dataset-level; flattened to lqcd.obs.*).
# Row K of ensembles/sources/ensemble_observables.csv, 2026-10-19.
# Hadron masses: large-m median Lanczos (Prony-Ritz) estimators, t in [2a, Lt/2],
# 200x200 nested bootstrap statistical uncertainties.
# ---------------------------------------------------------------------------
[observables]
source = "H-dibaryon paper draft tables (tab:wilson_flow, tab:results_single_hadron, tab:ensem_details, tab:prop_details) via ensembles/sources/ensemble_observables.csv, 2026-10-19"
paper_label = "K"

[observables.t0]
quantity = "t0/a^2"
value = 0.935
stat = 0.0003
notes = "Wilson flow measured directly on the gauge-field stream; statistical uncertainty only; number of configurations not recorded in the source table."

[observables.w0]
quantity = "w0/a"
value = 1.014
stat = 0.0002
notes = "Wilson flow measured directly on the gauge-field stream; statistical uncertainty only; number of configurations not recorded in the source table."

[observables.mpi]
quantity = "a*m_pi"
value = 0.5939
stat = 0.0003
ncfgs = 1250
notes = "8^3 grid of sparsened quark propagators on 1 timeslice with 20 steps of wave function smearing with width 2.1. Prony-Ritz analysis of t = [2, Lt/2] with korrfitter v0 defaults."

[observables.mN]
quantity = "a*M_N (degenerate octet baryon at the SU(3)-symmetric point)"
value = 1.2023
stat = 0.0015
ncfgs = 1250
notes = "8^3 grid of sparsened quark propagators on 1 timeslice with 20 steps of wave function smearing with width 2.1. Prony-Ritz analysis of t = [2, Lt/2] with korrfitter v0 defaults."

[observables.mpi_over_mN]
quantity = "m_pi/M_N"
value = 0.494
stat = 0.0006
ncfgs = 1250
notes = "8^3 grid of sparsened quark propagators on 1 timeslice with 20 steps of wave function smearing with width 2.1. Prony-Ritz analysis of t = [2, Lt/2] with korrfitter v0 defaults."

[observables.a]
schemes = ["t0", "w0"]
units = "fm"
notes = "Convention: flow scales measured at the SU(3)-symmetric point (m_pi ~ 800 MeV); the t0 and w0 schemes differ at this mass. Scale error is 100% correlated across ensembles."

[observables.a.t0]
definition = "a = sqrt(t0^phys / (t0/a^2)) with sqrt(t0^phys) = 0.14474(57) fm [FLAG Review 2024, arXiv:2411.04268, Eq. (499), Nf = 2+1 average]"
value = 0.149687
stat = 2.4e-05
scale_err = 0.000589

[observables.a.w0]
definition = "a = w0^phys / (w0/a) with w0^phys = 0.17187(68) fm [Fermilab Lattice & MILC, Omega-baryon + gradient-flow scale setting, arXiv:2509.14367; 0.17187(56)(38) fm = (correlator fits)(other systematics)]"
value = 0.169497
stat = 3.3e-05
scale_err = 0.000671

# Measurement setup behind the hadron masses (same numbers as in the notes).
[observables.spectrum_setup]
ncfgs = 1250
cfg_separation = 10
thermalization_trajectories = 500
sparsening_factor = 6
sparse_grid = "8^3"
n_src_timeslices = 1
smearing_width = 2.1
smearing_steps = 20
analysis = "Prony-Ritz (Lanczos), t = [2, Lt/2], korrfitter v0 defaults"
