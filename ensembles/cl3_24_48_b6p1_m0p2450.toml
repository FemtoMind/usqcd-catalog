# Ensemble description: cl3_24_48_b6p1_m0p2450
#
# Nf=3 stout-clover, 24^3 x 48, beta = 6.1, m = -0.2450 (same action as
# cl3_32_48_b6p1_m0p2450 on a smaller volume). Sixteen streams a..p, generated
# 16 at a time on Perlmutter GPU nodes in 2024
# (/pscratch/sd/w/wdetmold/gauge_gen/run4x4_cl3_24_48_b6p1_m0p2450.sh), each
# started from its own cfg_0 with a fresh RNG seed and NWarmUpUpdates = 0.
#
# HPSS layout: all streams live under one parent directory,
#   clover-iso/cl3_24_48_b6p1_m0p2450_ensembles/cl3_24_48_b6p1_m0p2450_<s>/
#     cfgs/cl3_24_48_b6p1_m0p2450_<s>_cfg_<N>.lime
#     cfgs/cl3_24_48_b6p1_m0p2450_<s>_restarts.tar   (all restart XMLs)
#     logs_cl3_24_48_b6p1_m0p2450_<s>.tar       (pbs.out, xml.log, xml.out)
#     plaquette_cl3_24_48_b6p1_m0p2450_<s>.tar
# The directory clover-iso/cl3_24_48_b6p1_m0p2450 (no suffix) holds only
# derived data (sparse propagators, correlators), not a stream.
#
# Numbers below are verbatim from
# cl3_24_48_b6p1_m0p2450_a_restart_10000.xml (chroma 3.40.0), found in
# /pscratch/sd/w/wdetmold/gauge_gen/cl3_24_48_b6p1_m0p2450_a_restarts.tar.

[ensemble]
name = "cl3_24_48_b6p1_m0p2450"
display_name = "cl3 24^3x48 beta=6.1 m=-0.2450"
collaboration = "NPLQCD"
generated_by = "W. Detmold (NERSC user wdetmold)"
machine = "NERSC Perlmutter (A100 GPU nodes, 1 GPU per stream)"
code = "Chroma hmc, QUDA, QDP-JIT double precision (install_jan_2024)"
year = 2024
storage = "nersc_hpss"
description = """\
Nf=3 (SU(3)-flavor-symmetric, m_l = m_s) stout-smeared clover Wilson fermion \
ensemble on a 24^3 x 48 lattice with the tree-level Luscher-Weisz gauge action \
at beta = 6.1 and bare quark mass -0.2450, the same action as the NPLQCD \
32^3 x 48 ensemble at this point. Generated by NPLQCD (W. Detmold) with \
Chroma/QUDA HMC on NERSC Perlmutter in 2024 as sixteen independent Markov \
chain streams (a to p) with identical parameters, each from its own start \
with trajectory numbering from 0. Configurations are saved every 10 HMC \
trajectories of length tau0 = 1.414 in SciDAC/ILDG LIME format, one file per \
configuration, with a tarball of HMC logs and a tarball of plaquette \
measurements per stream. Part of the NPLQCD clover-iso ensemble set."""

[lqcd]
nflavors = 3
flavor_structure = "3 degenerate (m_u = m_d = m_s)"
beta = 6.1
Nx = 24
Ny = 24
Nz = 24
Nt = 48
volume = [24, 24, 24, 48]

[lqcd.action]
gauge = "LW_TREE"
gauge_u0 = 0.832605301399891
fermion = "clover"
fermion_state = "STOUT_FERM_STATE"
csw = 1.24930970916466
anisotropic = false
fermion_bc = "1 1 1 -1"

[lqcd.mass]
light = -0.2450
strange = -0.2450

[lqcd.smearing]
type = "stout"
rho = 0.125
n_smear = 1

[lqcd.hmc]
tau0 = 1.414
integrator = "LCM_STS_MIN_NORM_2"
n_steps = 12
gauge_substeps = 5
save_interval = 10
n_warmup_updates = 0
rational_lower_min = 0.005
rational_upper_max = 32
code_version = "chroma 3.40.0 + quda (install_jan_2024)"

# Sixteen streams under the shared parent directory. "dir" is relative to the
# storage root and may contain a slash.
[streams.a]
dir = "cl3_24_48_b6p1_m0p2450_ensembles/cl3_24_48_b6p1_m0p2450_a"
[streams.b]
dir = "cl3_24_48_b6p1_m0p2450_ensembles/cl3_24_48_b6p1_m0p2450_b"
[streams.c]
dir = "cl3_24_48_b6p1_m0p2450_ensembles/cl3_24_48_b6p1_m0p2450_c"
[streams.d]
dir = "cl3_24_48_b6p1_m0p2450_ensembles/cl3_24_48_b6p1_m0p2450_d"
[streams.e]
dir = "cl3_24_48_b6p1_m0p2450_ensembles/cl3_24_48_b6p1_m0p2450_e"
[streams.f]
dir = "cl3_24_48_b6p1_m0p2450_ensembles/cl3_24_48_b6p1_m0p2450_f"
[streams.g]
dir = "cl3_24_48_b6p1_m0p2450_ensembles/cl3_24_48_b6p1_m0p2450_g"
[streams.h]
dir = "cl3_24_48_b6p1_m0p2450_ensembles/cl3_24_48_b6p1_m0p2450_h"
[streams.i]
dir = "cl3_24_48_b6p1_m0p2450_ensembles/cl3_24_48_b6p1_m0p2450_i"
[streams.j]
dir = "cl3_24_48_b6p1_m0p2450_ensembles/cl3_24_48_b6p1_m0p2450_j"
[streams.k]
dir = "cl3_24_48_b6p1_m0p2450_ensembles/cl3_24_48_b6p1_m0p2450_k"
[streams.l]
dir = "cl3_24_48_b6p1_m0p2450_ensembles/cl3_24_48_b6p1_m0p2450_l"
[streams.m]
dir = "cl3_24_48_b6p1_m0p2450_ensembles/cl3_24_48_b6p1_m0p2450_m"
[streams.n]
dir = "cl3_24_48_b6p1_m0p2450_ensembles/cl3_24_48_b6p1_m0p2450_n"
[streams.o]
dir = "cl3_24_48_b6p1_m0p2450_ensembles/cl3_24_48_b6p1_m0p2450_o"
[streams.p]
dir = "cl3_24_48_b6p1_m0p2450_ensembles/cl3_24_48_b6p1_m0p2450_p"

[[files]]
pattern = '^cfgs/.+_cfg_(?P<trajectory>\d+)\.lime$'
kind = "gauge_config"
format = "application/x-lime"
description = "Gauge configuration in SciDAC/ILDG LIME format (Chroma SZINQIO, single file)."

[[files]]
pattern = '^cfgs/.+_restarts\.tar$'
kind = "hmc_input_archive"
format = "application/x-tar"
description = "Tarball of the Chroma HMC restart input XML files for every saved configuration of this stream (full action, integrator and RNG seed per trajectory)."

[[files]]
pattern = '^logs_.+\.tar$'
kind = "hmc_log_archive"
format = "application/x-tar"
description = "Tarball of HMC job output for the whole stream (pbs.out, xml.log, xml.out)."

[[files]]
pattern = '^plaquette_.+\.tar$'
kind = "hmc_measurement_archive"
format = "application/x-tar"
description = "Tarball of per-trajectory plaquette measurements for the whole stream."
