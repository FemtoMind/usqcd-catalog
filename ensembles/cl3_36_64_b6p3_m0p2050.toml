# Ensemble description: cl3_36_64_b6p3_m0p2050
#
# Nf=3 stout-clover, 36^3 x 64, beta = 6.3, m = -0.2050 (one of two bare
# masses at this beta; the other is cl3_36_64_b6p3_m0p2170). Single stream.
# Numbers verbatim from cl3_36_64_b6p3_m0p2050_restart_5060.xml
# (chroma 3.40.0) in the HPSS cfgs directory.
#
# HPSS layout: clover-iso/cl3_36_64_b6p3_m0p2050/
#   cfgs/<ens>_cfg_<N>.lime + <ens>_restart_<N>.xml, logs.<N>.tar at the top
#   level; sparseprops-* and xml-* are derived data, not catalogued here.

[ensemble]
name = "cl3_36_64_b6p3_m0p2050"
display_name = "cl3 36^3x64 beta=6.3 m=-0.2050"
collaboration = "NPLQCD"
generated_by = "W. Detmold (NERSC user wdetmold)"
machine = "NERSC Perlmutter (A100 GPU nodes)"
code = "Chroma hmc 3.40.0, QUDA, QDP-JIT double precision"
year = 2024
storage = "nersc_hpss"
description = """\
Nf=3 (SU(3)-flavor-symmetric, m_l = m_s) stout-smeared clover Wilson fermion \
ensemble on a 36^3 x 64 lattice with the tree-level Luscher-Weisz gauge action \
at beta = 6.3 and bare quark mass -0.2050. Generated by NPLQCD (W. Detmold) \
with Chroma/QUDA HMC on NERSC Perlmutter in 2024. One Markov chain stream. \
Configurations are saved every 10 HMC trajectories of length tau0 = 1.414 in \
SciDAC/ILDG LIME format, one file per configuration, with the Chroma restart \
input XML for each saved configuration and tarballs of HMC logs alongside. \
Part of the NPLQCD clover-iso ensemble set (cl3 = three degenerate flavors)."""

[lqcd]
nflavors = 3
flavor_structure = "3 degenerate (m_u = m_d = m_s)"
beta = 6.3
Nx = 36
Ny = 36
Nz = 36
Nt = 64
volume = [36, 36, 36, 64]

[lqcd.action]
gauge = "LW_TREE"
gauge_u0 = 0.84570646270714
fermion = "clover"
fermion_state = "STOUT_FERM_STATE"
csw = 1.20536588031793
anisotropic = false
fermion_bc = "1 1 1 -1"

[lqcd.mass]
light = -0.2050
strange = -0.2050

[lqcd.smearing]
type = "stout"
rho = 0.125
n_smear = 1

[lqcd.hmc]
tau0 = 1.414
integrator = "LCM_STS_MIN_NORM_2"
n_steps = 16
gauge_substeps = 5
save_interval = 10
n_warmup_updates = 100
rational_lower_min = 0.003
rational_upper_max = 32
code_version = "chroma 3.40.0 + quda"

[streams.main]
dir = "cl3_36_64_b6p3_m0p2050"

[[files]]
pattern = '^cfgs/.+_cfg_(?P<trajectory>\d+)\.lime$'
kind = "gauge_config"
format = "application/x-lime"
description = "Gauge configuration in SciDAC/ILDG LIME format (Chroma SZINQIO, single file)."

[[files]]
pattern = '^cfgs/.+_restart_(?P<trajectory>\d+)\.xml$'
kind = "hmc_input"
format = "application/xml"
description = "Chroma HMC restart input XML used to continue the stream from this configuration (full action, integrator and RNG seed)."

[[files]]
pattern = '^logs?[.-](?P<trajectory>\d+)\.tar$'
kind = "hmc_log_archive"
format = "application/x-tar"
description = "Tarball of HMC job logs and inline measurements for trajectories up to the one in the file name."

# ---------------------------------------------------------------------------
# Downstream observables (dataset-level; flattened to lqcd.obs.*).
# Row D of ensembles/sources/ensemble_observables.csv, 2026-10-19.
# Hadron masses: large-m median Lanczos (Prony-Ritz) estimators, t in [2a, Lt/2],
# 200x200 nested bootstrap statistical uncertainties.
# ---------------------------------------------------------------------------
[observables]
source = "H-dibaryon paper draft tables (tab:wilson_flow, tab:results_single_hadron, tab:ensem_details, tab:prop_details) via ensembles/sources/ensemble_observables.csv, 2026-10-19"
paper_label = "D"

[observables.t0]
quantity = "t0/a^2"
value = 1.9278
stat = 0.0017
notes = "Wilson flow measured directly on the gauge-field stream; statistical uncertainty only; number of configurations not recorded in the source table."

[observables.w0]
quantity = "w0/a"
value = 1.5068
stat = 0.001
notes = "Wilson flow measured directly on the gauge-field stream; statistical uncertainty only; number of configurations not recorded in the source table."

[observables.mpi]
quantity = "a*m_pi"
value = 0.4024
stat = 0.0004
ncfgs = 630
notes = "6^3 grid of sparsened quark propagators on 2 timeslices with 100 steps of wave function smearing with width 4.0. Prony-Ritz analysis of t = [2, Lt/2] with korrfitter v0 defaults."

[observables.mN]
quantity = "a*M_N (degenerate octet baryon at the SU(3)-symmetric point)"
value = 0.8385
stat = 0.001
ncfgs = 630
notes = "6^3 grid of sparsened quark propagators on 2 timeslices with 100 steps of wave function smearing with width 4.0. Prony-Ritz analysis of t = [2, Lt/2] with korrfitter v0 defaults."

[observables.mpi_over_mN]
quantity = "m_pi/M_N"
value = 0.48
stat = 0.0004
ncfgs = 630
notes = "6^3 grid of sparsened quark propagators on 2 timeslices with 100 steps of wave function smearing with width 4.0. Prony-Ritz analysis of t = [2, Lt/2] with korrfitter v0 defaults."

[observables.a]
schemes = ["t0", "w0"]
units = "fm"
notes = "Convention: flow scales measured at the SU(3)-symmetric point (m_pi ~ 800 MeV); the t0 and w0 schemes differ at this mass. Scale error is 100% correlated across ensembles."

[observables.a.t0]
definition = "a = sqrt(t0^phys / (t0/a^2)) with sqrt(t0^phys) = 0.14474(57) fm [FLAG Review 2024, arXiv:2411.04268, Eq. (499), Nf = 2+1 average]"
value = 0.104246
stat = 4.6e-05
scale_err = 0.000411

[observables.a.w0]
definition = "a = w0^phys / (w0/a) with w0^phys = 0.17187(68) fm [Fermilab Lattice & MILC, Omega-baryon + gradient-flow scale setting, arXiv:2509.14367; 0.17187(56)(38) fm = (correlator fits)(other systematics)]"
value = 0.114063
stat = 7.6e-05
scale_err = 0.000451

# Measurement setup behind the hadron masses (same numbers as in the notes).
[observables.spectrum_setup]
ncfgs = 630
cfg_separation = 10
thermalization_trajectories = 500
sparsening_factor = 6
sparse_grid = "6^3"
n_src_timeslices = 2
smearing_width = 4.0
smearing_steps = 100
smearing_steps_source = "verified in the propagator run XML (xml-t16/1030.tar: wvf_kind GAUGE_INV_GAUSSIAN, wvf_param 4.0, wvfIntPar 100)"
analysis = "Prony-Ritz (Lanczos), t = [2, Lt/2], korrfitter v0 defaults"
