# Ensemble description: cl21_72_192_b6p7_m0p1843_m0p1640
#
# Nf=2+1 stout-clover, 72^3 x 192, beta = 6.7, m_l = -0.1843, m_s = -0.1640.
# One stream on NERSC HPSS. Numbers verbatim from the Chroma input embedded in
# the LIME header of cfg_1000 (chroma 3.44.0; scripts/lime_hmc_params.py).
# Also catalogued by JLab; records to be reconciled.

[ensemble]
name = "cl21_72_192_b6p7_m0p1843_m0p1640"
display_name = "cl21 72^3x192 beta=6.7 ml=-0.1843 ms=-0.1640"
collaboration = "NPLQCD"
generated_by = "NPLQCD (W. Detmold) / JLab isoClover program"
code = "Chroma hmc 3.44.0, QUDA"
storage = "nersc_hpss"
description = """\
Nf=2+1 stout-smeared clover Wilson fermion ensemble (JLab isoClover action) \
on a 72^3 x 192 lattice with the tree-level Luscher-Weisz gauge action at \
beta = 6.7, bare light-quark mass -0.1843 and strange-quark mass -0.1640, the \
finest lattice spacing of the set. One Markov chain stream on NERSC HPSS. \
Configurations are in SciDAC/ILDG LIME format, one file per configuration \
(about 41 GB), saved every 2 HMC trajectories of length tau0 = 1.414, \
force-gradient integrator with Hasenbusch preconditioning. The same ensemble \
is catalogued independently by JLab."""

[lqcd]
nflavors = 3
flavor_structure = "2+1 (m_u = m_d < m_s)"
beta = 6.7
Nx = 72
Ny = 72
Nz = 72
Nt = 192
volume = [72, 72, 72, 192]

[lqcd.action]
gauge = "LW_TREE"
gauge_u0 = 0.866588630467134
fermion = "clover"
fermion_state = "STOUT_FERM_STATE"
csw = 1.14272664055312
anisotropic = false
fermion_bc = "1 1 1 -1"

[lqcd.mass]
light = -0.1843
strange = -0.1640

[lqcd.smearing]
type = "stout"
rho = 0.125
n_smear = 1

[lqcd.hmc]
tau0 = 1.414
integrator = "LCM_STS_FORCE_GRAD"
n_steps = 13
save_interval = 2
n_warmup_updates = 20
hasenbusch_masses = [-0.1810, -0.1750, -0.140]
rational_lower_min = 0.0007
rational_upper_max = 32
code_version = "chroma 3.44.0 + quda"

[streams.main]
dir = "cl21_72_192_b6p7_m0p1843_m0p1640"

[[files]]
pattern = '^cfgs/.+_cfg_(?P<trajectory>\d+)\.lime$'
kind = "gauge_config"
format = "application/x-lime"
description = "Gauge configuration in SciDAC/ILDG LIME format, Chroma HMC input embedded in the header."
