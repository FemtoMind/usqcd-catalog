# Derived dataset: timeslice-to-all sparse propagators on cl21_96_192_b6p5_m0p2095_m0p1793
#
# HPSS layout (clover-iso/cl21_96_192_b6p5_m0p2095_m0p1793/):
#   sparseprops-t<T>/<TRAJ>.tar (+ .idx)   T = 0, 48, 96: one htar archive per
#        configuration and source timeslice, 2048 members
#        <TRAJ>/sprop_x<X>y<Y>z<Z>t<T>_{u,s}S4.0_S0.0.prop and _S4.0_S4.0.prop
#        (512 positions of the 8^3 grid x light and strange x point and width-4.0
#        sinks; verified on 1000.tar of each directory), 464 GB
#   sparseprops-t<T>/UNINDEXED_<TRAJ>.tar  same archives whose .idx was lost (t0: 13,
#                                          t48: 246, t96: 1); htar cannot list them
#                                          but tar can read them whole
#   sparseprops-t48/BROKEN<TRAJ>BROKEN.tar three archives flagged by the producer
#   sparseprops-t96/STALE_4500.tar.idx     an index without its archive
# and on stream 750 (clover-iso/cl21_96_192_b6p5_m0p2095_m0p1793-750/):
#   sparseprops-t0/<TRAJ>.tar              70 plain tars (no .idx), 232 GB: half the
#                                          size above, consistent with 1024 members
#                                          (one sink smearing); not verified
# Run XML (main stream): xml/<TRAJ>.tar (397, plain tar, the t = 0 runs),
# xml-t48/<TRAJ>.tar (plain), xml-t96/<TRAJ>.tar (+ .idx). Numbers verbatim from
# xml-t96/1000.tar: 1000/cl21_96_192_b6p5_m0p2095_m0p1793.101010.ini_prop.3.xml:
# SHELL_SOURCE t_srce "48 48 84 96", GAUGE_INV_GAUSSIAN wvf_param 4.0, wvfIntPar 80,
# no displacement; smearing gauge field STOUT_SMEAR 0.08 x 10 (spatial);
# QUDA_MULTIGRID_CLOVER_INVERTER, RsdTarget 1e-12, MaxIter 500, clovCoeff
# 1.170082389372972, masses -0.2095 / -0.1793; SHELL_SINK.
# The Frontier all-to-all set under frontier/ is the separate dataset
# cl21_96_192_b6p5_m0p2095_m0p1793_sparseprops_a2a.

[ensemble]
name = "cl21_96_192_b6p5_m0p2095_m0p1793_sparseprops"
parent = "cl21_96_192_b6p5_m0p2095_m0p1793"
kind = "sparse_propagator_set"
name_style = "path"
display_name = "cl21 96^3x192 beta=6.5 sparse propagators (timeslice-to-all)"
generated_by = "NPLQCD (W. Detmold et al.; 2024-2025)"
code = "Chroma + QUDA"
description = """\
Timeslice-to-all sparsened light and strange quark propagators on the \
cl21_96_192_b6p5_m0p2095_m0p1793 ensemble (Nf=2+1 stout-clover, 96^3 x 192, \
beta = 6.5, m_l = -0.2095, m_s = -0.1793), on streams main and 750: one \
archive per configuration and source timeslice (0, 48, 96 on main; 0 on \
750) holding the propagators from every source position of an 8^3 sparse \
grid (sparsening factor 12) for both flavors, with gauge-invariant Gaussian \
width-4.0 source smearing (80 steps on a stout-smeared field, 0.08 x 10) and \
both point and width-4.0 sink smearing, solved with the QUDA multigrid clover \
inverter to 1e-12 (2048 propagators, 464 GB per archive; the run XML is \
catalogued alongside). Archives whose htar index was lost \
(UNINDEXED_) and three flagged broken by the producer are included with \
lqcd.status set. Each archive is one catalog record with lqcd.parent.* \
naming its configuration."""

[derived.prop]
kind = "sparse_propagator"
topology = "timeslice-to-all"
file_format = "NPLQCD sprop binary, one file per source position, flavor and sink smearing"
sparse_grid = "8^3"
sparsening_factor = 12
n_sources_per_timeslice = 512
source_timeslices = [0, 48, 96]
flavors = ["light", "strange"]
member_flavor_prefix = "u = light, s = strange"
quark_mass_light = -0.2095
quark_mass_strange = -0.1793
source_type = "SHELL_SOURCE"
sink_type = "SHELL_SINK and POINT_SINK"
smearing_kind = "GAUGE_INV_GAUSSIAN"
smearing_width = 4.0
sink_smearing_widths = [0.0, 4.0]
smearing_steps = 80
smearing_steps_source = "wvfIntPar 80 in xml-t96/1000.tar ini_prop.3.xml"
link_smearing = "STOUT_SMEAR 0.08 x 10 iterations, spatial links, on the field used for source and sink smearing"
solver = "QUDA_MULTIGRID_CLOVER_INVERTER"
solver_rsd_target = 1e-12
solver_max_iter = 500
clover_coefficient = 1.170082389372972
smearing_combinations = ["S4.0_S0.0", "S4.0_S4.0"]
members_per_archive = 2048
member_name_template = "{trajectory}/sprop_x{x}y{y}z{z}t{tsrc}_{u|s}S4.0_S{w_snk}.prop"

[[files]]
pattern = '^sparseprops-t(?P<tsrc>\d+)/(?P<trajectory>\d+)\.tar$'
kind = "sparse_propagator_timeslice_to_all"
format = "application/x-tar"
parent_name = "{stream_dir}_cfg_{trajectory}.lime"
description = "Archive (htar where an .idx exists) of timeslice-to-all sparse propagators for one configuration and source timeslice: 512 source positions x light and strange x point and width-4.0 sink smearing (2048 members)."

[[files]]
pattern = '^sparseprops-t(?P<tsrc>\d+)/(?P<trajectory>\d+)\.tar\.idx$'
kind = "archive_index"
format = "application/octet-stream"
parent_name = "{stream_dir}_cfg_{trajectory}.lime"
description = "htar index for the propagator archive of the same name."

[[files]]
pattern = '^xml-t(?P<tsrc>\d+)/(?P<trajectory>\d+)\.tar$'
kind = "propagator_run_xml_archive"
format = "application/x-tar"
parent_name = "{stream_dir}_cfg_{trajectory}.lime"
description = "Archive of the Chroma input/output XML (ini_prop/out_prop) of every propagator solve on this configuration and source timeslice: source position, smearing, link smearing, solver and full action."

[[files]]
pattern = '^xml/(?P<trajectory>\d+)\.tar$'
kind = "propagator_run_xml_archive"
format = "application/x-tar"
parent_name = "{stream_dir}_cfg_{trajectory}.lime"
meta = { "lqcd.prop.tsrc" = 0 }
description = "Tarball of the Chroma input/output XML of every propagator solve on this configuration for the source-timeslice-0 run (directory xml/, 2024)."

[[files]]
pattern = '^xml-t(?P<tsrc>\d+)/(?P<trajectory>\d+)\.tar\.idx$'
kind = "archive_index"
format = "application/octet-stream"
parent_name = "{stream_dir}_cfg_{trajectory}.lime"
description = "htar index for the XML archive of the same name."

[[files]]
pattern = '^sparseprops-t(?P<tsrc>\d+)/UNINDEXED_(?P<trajectory>\d+)\.tar$'
kind = "sparse_propagator_timeslice_to_all"
format = "application/x-tar"
parent_name = "{stream_dir}_cfg_{trajectory}.lime"
meta = { "lqcd.status" = "htar index lost (UNINDEXED_): readable as a whole tar, no single-member extraction" }
description = "htar archive without its index of timeslice-to-all sparse propagators for one configuration and source timeslice (2048 members); read with tar, not htar."

[[files]]
pattern = '^sparseprops-t(?P<tsrc>\d+)/BROKEN(?P<trajectory>\d+)BROKEN\.tar$'
kind = "sparse_propagator_timeslice_to_all"
format = "application/x-tar"
parent_name = "{stream_dir}_cfg_{trajectory}.lime"
meta = { "lqcd.status" = "flagged BROKEN by the producer; do not use without checking" }
description = "Archive of timeslice-to-all sparse propagators flagged BROKEN by the producer."

[[files]]
pattern = '^sparseprops-t(?P<tsrc>\d+)/STALE_(?P<trajectory>\d+)\.tar\.idx$'
kind = "archive_index"
format = "application/octet-stream"
parent_name = "{stream_dir}_cfg_{trajectory}.lime"
meta = { "lqcd.status" = "stale index: its archive is absent" }
description = "htar index left behind without its archive."
