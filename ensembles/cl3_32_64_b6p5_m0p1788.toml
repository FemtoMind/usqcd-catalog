# Ensemble description: cl3_32_64_b6p5_m0p1788
#
# One file per *ensemble* (a set of Markov chain streams generated with
# identical action and algorithm parameters). Every stream of the ensemble is
# listed under [streams.*]; the catalog gets ONE dataset for the ensemble and
# every file carries lqcd.stream + lqcd.trajectory so streams can be told apart.
#
# Sources for the numbers below:
#   /pscratch/sd/w/wdetmold/gauge_gen/cl3_32_64_b6p5_m0p1788_restart_template.xml
#   /home/w/wdetmold/clover-iso/<stream>/cfgs/<stream>_restart_<n>.xml  (HPSS)
#   /pscratch/sd/w/wdetmold/gauge_gen/run1_cl3_32_64_b6p5_m0p1788.sh
# Values are copied verbatim from the Chroma HMC input; nothing is rounded.

[ensemble]
name = "cl3_32_64_b6p5_m0p1788"
display_name = "cl3 32^3x64 beta=6.5 m=-0.1788"
collaboration = "NPLQCD"
generated_by = "W. Detmold (NERSC user wdetmold)"
machine = "NERSC Perlmutter (A100 GPU nodes)"
code = "Chroma hmc, QUDA, QDP-JIT double precision (install_jul_2025)"
year = 2026
# Key into catalog.toml [storage.*]; stream dirs are relative to its root.
storage = "nersc_hpss"
description = """\
Nf=3 (SU(3)-flavor-symmetric, m_l = m_s) stout-smeared clover Wilson fermion \
ensemble on a 32^3 x 64 lattice with the tree-level Luscher-Weisz gauge action \
at beta = 6.5 and bare quark mass -0.1788. Generated by NPLQCD (W. Detmold) \
with Chroma/QUDA HMC on NERSC Perlmutter in 2026. Four Markov chain streams \
(main, a, b, c) with identical parameters; trajectory numbering restarts at 0 \
in each stream. Configurations are saved every 10 HMC trajectories of length \
tau0 = 1.414 in SciDAC/ILDG LIME format, one file per configuration, with the \
Chroma restart input XML for each saved configuration and tarballs of HMC \
logs/measurements alongside. Part of the NPLQCD clover-iso ensemble set \
(cl3 = three degenerate flavors) used for the H-dibaryon study."""

# ---------------------------------------------------------------------------
# Physics / algorithm parameters. Everything under [lqcd] is flattened to
# dotted keys with the prefix "lqcd." and attached to the dataset and to
# every file (so a file record is self-describing when found by a query).
# ---------------------------------------------------------------------------
[lqcd]
nflavors = 3
flavor_structure = "3 degenerate (m_u = m_d = m_s)"
beta = 6.5
Nx = 32
Ny = 32
Nz = 32
Nt = 64
volume = [32, 32, 32, 64]

[lqcd.action]
gauge = "LW_TREE"              # Chroma LW_TREE_GAUGEACT: tree-level Luscher-Weisz
gauge_u0 = 0.85703554213273    # tadpole factor in the gauge action
fermion = "clover"             # Chroma CLOVER on a stout-smeared gauge field
fermion_state = "STOUT_FERM_STATE"
csw = 1.170082389372972        # clovCoeff (tree-level tadpole-improved)
anisotropic = false
fermion_bc = "1 1 1 -1"        # periodic space, antiperiodic time

[lqcd.mass]
light = -0.1788
strange = -0.1788

[lqcd.smearing]
type = "stout"
rho = 0.125
n_smear = 1

[lqcd.hmc]
tau0 = 1.414
integrator = "LCM_STS_MIN_NORM_2"
n_steps = 16
gauge_substeps = 5
save_interval = 10             # trajectories between saved configurations
n_warmup_updates = 100
rational_lower_min = 0.003
rational_upper_max = 32
code_version = "chroma 3.x + quda (install_jul_2025)"

# ---------------------------------------------------------------------------
# Streams. The table key is the stream label stored in lqcd.stream.
# "dir" is the HPSS directory (relative to storage root) holding this stream.
# parent_* record where a stream was branched from, when known; leave them
# out when unknown rather than guessing.
# ---------------------------------------------------------------------------
[streams.main]
dir = "cl3_32_64_b6p5_m0p1788"
note = "Primary stream, started from a fresh start (reunit) at trajectory 0, Jan 2026."

[streams.a]
dir = "cl3_32_64_b6p5_m0p1788-a"
note = "Branched 2026-03-13 from an unrecorded main-stream configuration (its restart_0.xml re-seeds the RNG and reunitarizes); branch point to be confirmed with the generator."

[streams.b]
dir = "cl3_32_64_b6p5_m0p1788-b"
note = "Branched 2026-03-13, same procedure as stream a."

[streams.c]
dir = "cl3_32_64_b6p5_m0p1788-c"
note = "Branched 2026-03-13, same procedure as stream a."

# ---------------------------------------------------------------------------
# File classification rules, tried in order against each file's path
# relative to the stream directory. A named group "trajectory" sets
# lqcd.trajectory. Unmatched files are reported and skipped.
# ---------------------------------------------------------------------------
[[files]]
pattern = '^cfgs/.+_cfg_(?P<trajectory>\d+)\.lime$'
kind = "gauge_config"
format = "application/x-lime"
description = "Gauge configuration in SciDAC/ILDG LIME format (Chroma SZINQIO, single file)."

[[files]]
pattern = '^cfgs/.+_restart_(?P<trajectory>\d+)\.xml$'
kind = "hmc_input"
format = "application/xml"
description = "Chroma HMC restart input XML used to continue the stream from this configuration (full action, integrator and RNG seed)."

[[files]]
pattern = '^logs?\.(?P<trajectory>\d+)\.tar$'
kind = "hmc_log_archive"
format = "application/x-tar"
description = "Tarball of HMC job logs and inline measurements (plaquette, Wilson loops, Dirac eigenvalue bounds, job output) for trajectories up to the one in the file name."

# ---------------------------------------------------------------------------
# Downstream observables (dataset-level; flattened to lqcd.obs.*).
# Row A of ensembles/sources/ensemble_observables.csv, 2026-10-19.
# Hadron masses: large-m median Lanczos (Prony-Ritz) estimators, t in [2a, Lt/2],
# 200x200 nested bootstrap statistical uncertainties.
# ---------------------------------------------------------------------------
[observables]
source = "H-dibaryon paper draft tables (tab:wilson_flow, tab:results_single_hadron, tab:ensem_details, tab:prop_details) via ensembles/sources/ensemble_observables.csv, 2026-10-19"
paper_label = "A"

[observables.t0]
quantity = "t0/a^2"
value = 3.4968
stat = 0.0071
notes = "Wilson flow measured directly on the gauge-field stream; statistical uncertainty only; number of configurations not recorded in the source table."

[observables.w0]
quantity = "w0/a"
value = 2.0473
stat = 0.0034
notes = "Wilson flow measured directly on the gauge-field stream; statistical uncertainty only; number of configurations not recorded in the source table."

[observables.mpi]
quantity = "a*m_pi"
value = 0.304
stat = 0.0003
ncfgs = 680
notes = "4^3 grid of sparsened quark propagators on 8 timeslices with 150 steps of wave function smearing with width 6.0. Prony-Ritz analysis of t = [2, Lt/2] with korrfitter v0 defaults."

[observables.mN]
quantity = "a*M_N (degenerate octet baryon at the SU(3)-symmetric point)"
value = 0.639
stat = 0.0009
ncfgs = 680
notes = "4^3 grid of sparsened quark propagators on 8 timeslices with 150 steps of wave function smearing with width 6.0. Prony-Ritz analysis of t = [2, Lt/2] with korrfitter v0 defaults."

[observables.mpi_over_mN]
quantity = "m_pi/M_N"
value = 0.4758
stat = 0.0005
ncfgs = 680
notes = "4^3 grid of sparsened quark propagators on 8 timeslices with 150 steps of wave function smearing with width 6.0. Prony-Ritz analysis of t = [2, Lt/2] with korrfitter v0 defaults."

[observables.a]
schemes = ["t0", "w0"]
units = "fm"
notes = "Convention: flow scales measured at the SU(3)-symmetric point (m_pi ~ 800 MeV); the t0 and w0 schemes differ at this mass. Scale error is 100% correlated across ensembles."

[observables.a.t0]
definition = "a = sqrt(t0^phys / (t0/a^2)) with sqrt(t0^phys) = 0.14474(57) fm [FLAG Review 2024, arXiv:2411.04268, Eq. (499), Nf = 2+1 average]"
value = 0.077402
stat = 7.9e-05
scale_err = 0.000305

[observables.a.w0]
definition = "a = w0^phys / (w0/a) with w0^phys = 0.17187(68) fm [Fermilab Lattice & MILC, Omega-baryon + gradient-flow scale setting, arXiv:2509.14367; 0.17187(56)(38) fm = (correlator fits)(other systematics)]"
value = 0.08395
stat = 0.000139
scale_err = 0.000332

# Measurement setup behind the hadron masses (same numbers as in the notes).
[observables.spectrum_setup]
ncfgs = 680
cfg_separation = 10
thermalization_trajectories = 500
sparsening_factor = 8
sparse_grid = "4^3"
n_src_timeslices = 8
smearing_width = 6.0
smearing_steps = 150
smearing_steps_source = "same width (6.0) and production setup as the verified cl3_48_96_b6p5_m0p1788 run (wvfIntPar 150); not read from the XML of this ensemble"
analysis = "Prony-Ritz (Lanczos), t = [2, Lt/2], korrfitter v0 defaults"
