# Ensemble description: cl3_36_64_b6p3_m0p2170
#
# Nf=3 stout-clover, 36^3 x 64, beta = 6.3, m = -0.2170 (one of two bare
# masses at this beta; the other is cl3_36_64_b6p3_m0p2050). Single stream.
# Numbers verbatim from cl3_36_64_b6p3_m0p2170_restart_5030.xml
# (chroma 3.40.0) in the HPSS cfgs directory. Layout as for m0p2050.

[ensemble]
name = "cl3_36_64_b6p3_m0p2170"
display_name = "cl3 36^3x64 beta=6.3 m=-0.2170"
collaboration = "NPLQCD"
generated_by = "W. Detmold (NERSC user wdetmold)"
machine = "NERSC Perlmutter (A100 GPU nodes)"
code = "Chroma hmc 3.40.0, QUDA, QDP-JIT double precision"
year = 2024
storage = "nersc_hpss"
description = """\
Nf=3 (SU(3)-flavor-symmetric, m_l = m_s) stout-smeared clover Wilson fermion \
ensemble on a 36^3 x 64 lattice with the tree-level Luscher-Weisz gauge action \
at beta = 6.3 and bare quark mass -0.2170. Generated by NPLQCD (W. Detmold) \
with Chroma/QUDA HMC on NERSC Perlmutter in 2024. One Markov chain stream. \
Configurations are saved every 10 HMC trajectories of length tau0 = 1.414 in \
SciDAC/ILDG LIME format, one file per configuration, with the Chroma restart \
input XML for each saved configuration and tarballs of HMC logs alongside. \
Part of the NPLQCD clover-iso ensemble set (cl3 = three degenerate flavors)."""

[lqcd]
nflavors = 3
flavor_structure = "3 degenerate (m_u = m_d = m_s)"
beta = 6.3
Nx = 36
Ny = 36
Nz = 36
Nt = 64
volume = [36, 36, 36, 64]

[lqcd.action]
gauge = "LW_TREE"
gauge_u0 = 0.84570646270714
fermion = "clover"
fermion_state = "STOUT_FERM_STATE"
csw = 1.20536588031793
anisotropic = false
fermion_bc = "1 1 1 -1"

[lqcd.mass]
light = -0.2170
strange = -0.2170

[lqcd.smearing]
type = "stout"
rho = 0.125
n_smear = 1

[lqcd.hmc]
tau0 = 1.414
integrator = "LCM_STS_MIN_NORM_2"
n_steps = 16
gauge_substeps = 5
save_interval = 10
n_warmup_updates = 50
rational_lower_min = 0.003
rational_upper_max = 32
code_version = "chroma 3.40.0 + quda"

[streams.main]
dir = "cl3_36_64_b6p3_m0p2170"

[[files]]
pattern = '^cfgs/.+_cfg_(?P<trajectory>\d+)\.lime$'
kind = "gauge_config"
format = "application/x-lime"
description = "Gauge configuration in SciDAC/ILDG LIME format (Chroma SZINQIO, single file)."

[[files]]
pattern = '^cfgs/.+_restart_(?P<trajectory>\d+)\.xml$'
kind = "hmc_input"
format = "application/xml"
description = "Chroma HMC restart input XML used to continue the stream from this configuration (full action, integrator and RNG seed)."

[[files]]
pattern = '^logs?[.-](?P<trajectory>\d+)\.tar$'
kind = "hmc_log_archive"
format = "application/x-tar"
description = "Tarball of HMC job logs and inline measurements for trajectories up to the one in the file name."
