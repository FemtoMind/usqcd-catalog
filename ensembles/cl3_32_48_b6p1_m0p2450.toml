# Ensemble description: cl3_32_48_b6p1_m0p2450
#
# Nf=3 stout-clover, 32^3 x 48, beta = 6.1, m = -0.2450: the SU(3)-flavor-
# symmetric point of NPLQCD's 2012-2013 light nuclei / hypernuclei studies.
# Three streams on HPSS: cl3_32_48_b6p1_m0p2450 (main), _b, _c.
#
# Storage layout differs from the newer ensembles: configurations are packed
# into plain tar archives of ~1000 LIME files each, named by trajectory range
# (cl3_32_48_b6p1_m0p2450_b_cfg_10000-19990.tar, ~0.9 TB). Each archive is one
# catalog record of kind gauge_config_archive with lqcd.trajectory_min/max.
# No HMC restart inputs or logs are archived alongside.
#
# Action/algorithm numbers: no restart XML survives for this volume, so they
# are taken verbatim from the Chroma restart input of the 24^3 x 48 ensemble
# with the same beta and mass (cl3_24_48_b6p1_m0p2450_a_restart_10000.xml,
# chroma 3.40.0); csw and u0 depend only on beta and match that file.
# Integrator step counts (n_steps) may have differed on this larger volume
# and are therefore omitted here.

[ensemble]
name = "cl3_32_48_b6p1_m0p2450"
display_name = "cl3 32^3x48 beta=6.1 m=-0.2450"
collaboration = "NPLQCD"
generated_by = "W. Detmold (NERSC user wdetmold)"
code = "Chroma hmc (3.40.0 era)"
storage = "nersc_hpss"
description = """\
Nf=3 (SU(3)-flavor-symmetric, m_l = m_s) stout-smeared clover Wilson fermion \
ensemble on a 32^3 x 48 lattice with the tree-level Luscher-Weisz gauge action \
at beta = 6.1 and bare quark mass -0.2450, the SU(3)-symmetric point used in \
NPLQCD's light nuclei and hypernuclei studies. Generated by NPLQCD \
(W. Detmold) with Chroma HMC. Three Markov chain streams (main, b, c) with \
identical parameters; trajectory numbering is per stream. Configurations are \
saved every 10 HMC trajectories of length tau0 = 1.414 in SciDAC/ILDG LIME \
format and are archived on NERSC HPSS as plain tar files of about 1000 \
configurations each, named by the trajectory range they contain; each archive \
is one catalog record. Part of the NPLQCD clover-iso ensemble set (cl3 = three \
degenerate flavors)."""

[lqcd]
nflavors = 3
flavor_structure = "3 degenerate (m_u = m_d = m_s)"
beta = 6.1
Nx = 32
Ny = 32
Nz = 32
Nt = 48
volume = [32, 32, 32, 48]

[lqcd.action]
gauge = "LW_TREE"
gauge_u0 = 0.832605301399891
fermion = "clover"
fermion_state = "STOUT_FERM_STATE"
csw = 1.24930970916466
anisotropic = false
fermion_bc = "1 1 1 -1"

[lqcd.mass]
light = -0.2450
strange = -0.2450

[lqcd.smearing]
type = "stout"
rho = 0.125
n_smear = 1

[lqcd.hmc]
tau0 = 1.414
integrator = "LCM_STS_MIN_NORM_2"
save_interval = 10
rational_lower_min = 0.005
rational_upper_max = 32

[streams.main]
dir = "cl3_32_48_b6p1_m0p2450"
note = "Primary stream; archives cover trajectories 10-45570."

[streams.b]
dir = "cl3_32_48_b6p1_m0p2450_b"
note = "Archives cover trajectories 310-42410 (gap between 5750 and 7170 in the archive naming)."

[streams.c]
dir = "cl3_32_48_b6p1_m0p2450_c"
note = "Archives cover trajectories 910-41970."

# Only the configuration archives are catalogued here. The stream directories
# also hold sparse propagators, contraction outputs and 2012-era analysis
# scripts; those get their own artifact kinds later.
[[files]]
pattern = '^cfgs/.+_cfg_(?P<trajectory_min>\d+)-(?P<trajectory_max>\d+)\.tar$'
kind = "gauge_config_archive"
format = "application/x-tar"
description = "Plain tar archive of SciDAC/ILDG LIME gauge configurations, one file per saved trajectory in the named range (every 10 trajectories). Not an htar archive: extract with tar after staging from tape."
