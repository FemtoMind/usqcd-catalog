provenance = '''
Derived dataset: all-to-all sparse propagators on cl21_48_96_b6p3_m0p2416_m0p2050
(OLCF Frontier production, 2025-2026)

HPSS layout (clover-iso/<stream dir>/frontier/):
  propagators/<TRAJ>.tar (+ .idx)      light quark, all eight streams: 41472 members
       <TRAJ>/sprop_x<X>y<Z>z<Z>t<T>_uS7.0_S0.0.prop and _uS7.0_S7.0.prop for all 216
       positions of the 6^3 sparse grid x all 96 source timeslices x two sink
       smearings (0.0 = point, 7.0), 991 GB per configuration (verified: main 1000.tar)
  strange-props/<TRAJ>.tar (+ .idx)    the same for the strange quark (sS7.0_S0.0 /
       sS7.0_S7.0, plus manifest.txt) on main, -1000, -1200 and -2420
  initial-run/propagators/<TRAJ>.tar   main stream only, 26 configurations, light,
       S7.0_S7.0 only (20736 members)
  propagators/timeslice-to-self/       equal-time blocks S(x,t; y,t) of the light
       propagator on the same grid, derived from the above (README_Stt.md inside):
       <TRAJ>_Stt.tar  = <TRAJ>_Stt.h5 (dataset Stt[t,x,y,s,c,s',c'], shape
                         (96,216,216,4,3,4,3) complex, 10.3 GB, fletcher32 per
                         timeslice, sha256 sidecar, README/checker/packer embedded)
       <TRAJ>.tar      = the 96 S<t>.npy arrays the .h5 was packed from
       MANIFEST.tsv, README_Stt.md, checkme_stt.py, pack_stt.py
Sources on every sparse site of every timeslice make this an all-to-all
(sparse-to-sparse) set, the input for matrix elements, meson fields and the
two-pion contractions. Smearing step count for width 7.0: not in any archived
run XML; the 2025 smearing tests on this ensemble encode S7.0N100 (100 steps).
--- light quark, all streams
--- strange quark, main, -1000, -1200, -2420
--- initial run, main stream, smeared sink only
--- timeslice-to-self blocks derived from the light all-to-all set
'''
parent = "cl21_48_96_b6p3_m0p2416_m0p2050"
kind = "sparse_propagator_set"
name_style = "path"
display_name = "cl21 48^3x96 beta=6.3 sparse propagators (all-to-all, Frontier)"
generated_by = "NPLQCD (OLCF Frontier, 2025-2026)"
code = "Chroma + QUDA"
description = """\
All-to-all sparsened quark propagators on the \
cl21_48_96_b6p3_m0p2416_m0p2050 ensemble (Nf=2+1 stout-clover, 48^3 x 96, \
beta = 6.3, m_l = -0.2416, m_s = -0.2050), produced on OLCF Frontier: for \
every configuration one htar archive per flavor holding the propagators from \
every site of a 6^3 sparse grid (sparsening factor 8) on every one of the 96 \
timeslices, with gauge-invariant Gaussian width-7.0 source smearing and both \
point and width-7.0 sink smearing (41472 propagators, 991 GB per archive). \
Light-quark archives exist on all eight streams, strange-quark archives on \
four, plus a 26-configuration initial run. The equal-time blocks of the \
light propagator (timeslice-to-self, lqcd.artifact.kind = \
sparse_propagator_timeslice_to_self) packed as self-checking HDF5 files are \
included. The all-to-all variety is the input for matrix-element \
calculations, meson fields and multi-hadron contractions. Each archive is \
one catalog record with lqcd.parent.* naming its configuration."""

