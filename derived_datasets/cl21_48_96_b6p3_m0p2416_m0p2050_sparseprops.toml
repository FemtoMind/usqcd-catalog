[ensemble]
name = "cl21_48_96_b6p3_m0p2416_m0p2050_sparseprops"
provenance = '''
Derived dataset: timeslice-to-all sparse propagators on cl21_48_96_b6p3_m0p2416_m0p2050

HPSS layout, the same on all eight stream directories
(clover-iso/cl21_48_96_b6p3_m0p2416_m0p2050{,-1000,-1200,-2420,-djm-1..4}/):
  sparseprops-t<T>/<TRAJ>.tar (+ .idx)   T = 0, 24, 48, 72 everywhere; 12 on djm-2/djm-3
  sparseprops-t0/<TRAJ>.tar.gz           2021 original runs (main: 51, djm-4: 186), see README
  sparseprops-t0/README                  "the .tar.gz are original runs and include some
                                          matrix element extended propagators; the straight
                                          smeared-smeared props have been re-tarred as .tar"
  -1200/sparseprops-t0/bluewaters_2019_nplqcd_production_scripts_and_sources.tar
Two archive layouts coexist, read with htar -tvf (sprop_members.py):
  1024 members, 116 GB: <TRAJ>/sprop_x<X>y<Y>z<Z>t<T>_{u,s}S3.0_S3.0.prop, 512 positions
        of the 8^3 grid x light (u) and strange (s), width-3.0 source and sink smearing,
        source timeslice = the directory's T (verified main t0, t24; -1000 t0; djm-2 t12)
  4096 members, 464 GB: the same positions and flavors x four source/sink smearing
        combinations. Two productions: main/sparseprops-t72 (2025-06, S0.0/S3.0, point
        and smeared, t = 72) and the 2025-04 sets under sparseprops-t0/ on djm-1, djm-2
        and djm-4 (S3.0/S4.5) whose source timeslice is chosen per configuration
        (djm-4: 1000.tar has t = 2, 1500.tar has t = 75) despite the directory name.
So lqcd.prop.tsrc from the directory name is nominal; build with
--archive-index work/<this>/members.json (bin/sprop_members_xfer.sh) and every archive
with a readable .idx carries lqcd.prop.tsrc_list / flavors / smearing_combinations /
n_members read from its own index. Archives without .idx keep the nominal values.
  xml-t<T>/<TRAJ>.tar                    the Chroma input/output XML of every solve
                                         (plain tars; 328 MB to 2.3 GB per configuration)
  -2420, -djm-3: run-sparse_nersc_10-4-25.tar.gz   the 2025 production scripts
Smearing/solver numbers verbatim from main xml-t0/1000.tar:
1000/cl21_48_96_b6p3_m0p2416_m0p2050.t0.101010.ini_prop.3.xml (2025-04 production):
SHELL_SOURCE / SHELL_SINK, GAUGE_INV_GAUSSIAN wvf_param 3.0, wvfIntPar 35, no
displacement; the smearing gauge field is STOUT_SMEAR link_smear_fact 0.16 x 8
(spatial only); QUDA_MULTIGRID_CLOVER_INVERTER, RsdTarget 1e-12, MaxIter 500,
clovCoeff 1.20536588031793, masses -0.2416 / -0.2050. Steps for width 4.5 are not
in that file (the 4.5 sets are on the djm streams, whose XML is on tape).
--- production archives, one per configuration and (nominal) source timeslice
--- 2021 original runs, gzipped, with matrix-element extended propagators
--- the Chroma XML of every solve
'''
parent = "cl21_48_96_b6p3_m0p2416_m0p2050"
kind = "sparse_propagator_set"
name_style = "path"
display_name = "cl21 48^3x96 beta=6.3 sparse propagators (timeslice-to-all)"
generated_by = "NPLQCD (W. Detmold et al.; 2019-2025)"
code = "Chroma + QUDA"
description = """\
Timeslice-to-all sparsened light and strange quark propagators on the \
cl21_48_96_b6p3_m0p2416_m0p2050 ensemble (Nf=2+1 stout-clover, 48^3 x 96, \
beta = 6.3, m_l = -0.2416, m_s = -0.2050), on all eight streams: one archive \
per configuration and source timeslice holding the propagators from every \
source position of an 8^3 sparse grid (sparsening factor 6) for both \
flavors, with gauge-invariant Gaussian source and sink smearing. Most \
archives hold 1024 propagators (512 positions x {u, s}) with width-3.0 \
source and sink smearing at source timeslice 0, 24, 48 or 72 (12 on two \
streams); the 2025 sets hold 4096 (four source/sink smearing combinations of \
widths 3.0 and 4.5, or 0.0 and 3.0) at one source timeslice chosen per \
configuration. Where an htar index exists the record says exactly what the \
archive holds (lqcd.prop.tsrc_list, flavors, smearing_combinations, \
n_members). Width-3.0 smearing uses 35 steps on a stout-smeared field (0.16 \
x 8), solved with the QUDA multigrid clover inverter to 1e-12 (read from the \
archived run XML, xml-t<T>/, which is catalogued alongside). The 2021 \
original-run .tar.gz archives (smeared-smeared propagators plus \
matrix-element extended propagators) are included with lqcd.prop.variant = \
original-run. Each archive is one catalog record with lqcd.parent.* naming \
its configuration."""

[derived.prop]
kind = "sparse_propagator"
topology = "timeslice-to-all"
file_format = "NPLQCD sprop binary, one file per source position, flavor and smearing combination"
sparse_grid = "8^3"
sparsening_factor = 6
n_sources_per_timeslice = 512
source_timeslices = [0, 12, 24, 48, 72]
source_timeslice_note = """\
directory name; the 2025 4096-member sets use one source timeslice per \
configuration, given by lqcd.prop.tsrc_list where the archive has an htar \
index"""
flavors = ["light", "strange"]
member_flavor_prefix = "u = light, s = strange"
quark_mass_light = -0.2416
quark_mass_strange = -0.205
source_type = "SHELL_SOURCE"
sink_type = "SHELL_SINK"
smearing_kind = "GAUGE_INV_GAUSSIAN"
smearing_widths = [3.0, 4.5]
smearing_steps = 35
smearing_steps_source = """\
width 3.0: wvfIntPar 35 in main xml-t0/1000.tar ini_prop.3.xml (2025 \
production); width 4.5: unrecorded"""
link_smearing = """\
STOUT_SMEAR 0.16 x 8 iterations, spatial links, on the field used for source \
and sink smearing"""
solver = "QUDA_MULTIGRID_CLOVER_INVERTER"
solver_rsd_target = 1e-12
solver_max_iter = 500
clover_coefficient = 1.20536588031793
archive_layouts = """\
1024 members (512 positions x {u,s}, S3.0_S3.0, 116 GB) or 4096 members (x \
four source/sink smearing combinations, 464 GB)"""
member_bytes = 113312192
member_name_template = "{trajectory}/sprop_x{x}y{y}z{z}t{tsrc}_{u|s}S{w_src}_S{w_snk}.prop"

[[files]]
pattern = '^sparseprops-t(?P<tsrc>\d+)/(?P<trajectory>\d+)\.tar$'
