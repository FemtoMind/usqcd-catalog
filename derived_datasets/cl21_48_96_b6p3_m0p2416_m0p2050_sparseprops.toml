meta = { "lqcd.prop.variant" = "original-run", "lqcd.prop.contents" = "2021 original run: smeared-smeared sparse propagators plus matrix-element extended propagators; the plain .tar of the same configuration holds the re-tarred smeared-smeared set" }
description = """\
Gzipped tar of a 2021 original propagator run for one configuration at \
source timeslice 0, including matrix-element extended propagators (see \
sparseprops-t0/README)."""

[[files]]
pattern = '^xml-t(?P<tsrc>\d+)/(?P<trajectory>\d+)\.tar$'
kind = "propagator_run_xml_archive"
format = "application/x-tar"
