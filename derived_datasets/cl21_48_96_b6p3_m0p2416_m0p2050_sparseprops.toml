description = """\
Archive (htar where an .idx exists) of timeslice-to-all sparse propagators \
for one configuration: 512 source positions x light and strange, one or four \
source/sink smearing combinations; lqcd.prop.tsrc_list gives the actual \
source timeslice where the index was read."""

[[files]]
