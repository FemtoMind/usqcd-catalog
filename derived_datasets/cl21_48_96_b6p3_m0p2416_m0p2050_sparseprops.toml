Tarball of the Chroma input/output XML (ini_prop/out_prop) of every \
propagator solve on this configuration and source timeslice: source \
position, smearing, link smearing, solver and full action."""

[[files]]
pattern = '^run-sparse_nersc_[\d-]+\.tar\.gz$'
