# [ensemble] provenance.

[ensemble]
name = "cl3_32_64_b6p5_m0p1788_sparseprops"
provenance = '''
Derived dataset: sparse quark propagators on cl3_32_64_b6p5_m0p1788 (paper label A)

A derived dataset names its parent ensemble and inherits the parent's
physics and streams; every record carries lqcd.parent.* pointing at the
configuration it was computed on. Catalog names are
"<gauge stream dir>/<path below HPSS /home/r/rperry/nplqcd/cl3_32_64_b6p5_m0p1788>"
(name_style = "path"): the propagators were computed and archived by
R. Perry under his own HPSS tree, not wdetmold's clover-iso tree where the
gauge configurations live, so the inventory
(work/cl3_32_64_b6p5_m0p1788_sparseprops/inventory.json) is built from an
`hsi ls -lR` of that tree by delta/a_sprop_inventory.py, not from the parent's.

HPSS layout (/home/r/rperry/nplqcd/cl3_32_64_b6p5_m0p1788/propagators/):
  stream-a/<TRAJ>.tar     213 archives, traj 510-2630 every 10
  stream-b/<TRAJ>.tar      60 archives, traj 510-1100 every 10
  stream-c/<TRAJ>.tar      60 archives, traj 510-1100 every 10
  unlabelled/<TRAJ>.tar   209 archives, traj 510-2590 every 10
Directory -> gauge stream: stream-a/b/c -> a/b/c; unlabelled -> main.
One plain tar (no htar index) per configuration, 4832102400 bytes, holding
<TRAJ>/sprop_x<X>y<Y>z<Z>t<T>_uS6.0_S6.0.prop for every source position of the
4^3 sparse grid (sparsening factor 8) on each of the 8 source timeslices
t = 0, 8, ..., 56: 512 files of 9437184 bytes (12 x 12 x 64 x 4^3 complex128,
raw, no header), read from stream-a/1000.tar on 2026-10-27.
stream-b/630.tar is 4822671360 bytes, about one propagator file short of the
others (archived 2026-10-27 14:51); recorded at its actual size.
Smearing width 6.0 from the member names; 150 smearing steps from the parent
ensemble's [observables.spectrum_setup] (the same production setup as
cl3_48_96_b6p5_m0p1788, not read from this dataset's XML: no XML is archived
with these propagators). Solver not recorded.
Facts about the product (flattened to lqcd.prop.* on every record).
Rule: one plain tar per configuration in each of the four directories.
'''
parent = "cl3_32_64_b6p5_m0p1788"
kind = "sparse_propagator_set"
name_style = "path"
display_name = "cl3 32^3x64 beta=6.5 sparse propagators"
generated_by = "NPLQCD (R. Perry)"
description = """\
Sparsened quark propagators on the cl3_32_64_b6p5_m0p1788 ensemble (Nf=3 \
stout-clover, 32^3 x 64, beta = 6.5, m = -0.1788): one archive per gauge \
configuration holding the propagators from every source position on a 4^3 \
sparse grid (sparsening factor 8) on each of the 8 source timeslices t = 0, \
8, ..., 56, with gauge-invariant Gaussian source and sink smearing of width \
6.0. Input to the NPLQCD H-dibaryon correlators. Archived by R. Perry on \
NERSC HPSS (/home/r/rperry/nplqcd); each archive is one catalog record with \
lqcd.parent.* naming the configuration it was computed on."""

[derived.prop]
kind = "sparse_propagator"
topology = "timeslice-to-all"
file_format = "NPLQCD sprop binary (raw complex128, no header), one file per source position"
sparse_grid = "4^3"
sparsening_factor = 8
n_sources_per_timeslice = 64
source_timeslices = [0, 8, 16, 24, 32, 40, 48, 56]
smearing_kind = "GAUGE_INV_GAUSSIAN"
smearing_width = 6.0
smearing_steps = 150
quark_mass = -0.1788
member_name_template = "{trajectory}/sprop_x{x}y{y}z{z}t{tsrc}_uS6.0_S6.0.prop"

[[files]]
pattern = '^propagators/(stream-[abc]|unlabelled)/(?P<trajectory>\d+)\.tar$'
kind = "sparse_propagator_timeslice_to_all"
format = "application/x-tar"
parent_name = "{stream_dir}_cfg_{trajectory}.lime"
description = """\
Plain tar of the timeslice-to-all sparse propagators for one configuration: \
512 sprop files, 64 source positions on the 4^3 grid on each of the 8 source \
timeslices t = 0, 8, ..., 56."""

[catalog]
revision = "2026-10-28T02:07:01Z/mwagman"
schema_version = 2
